[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/openvclient-app"]

[workspace.package]
version = "1.0.0-beta.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openvclient/openvclient"
homepage = "https://openvclient.xyz"
rust-version = "1.95"

[workspace.dependencies]
openvclient-core = { path = "crates/openvclient-core" }
openvclient-sqlite = { path = "crates/openvclient-sqlite" }
openvclient-postgres = { path = "crates/openvclient-postgres" }
openvclient-mysql = { path = "crates/openvclient-mysql" }
openvclient-redis = { path = "crates/openvclient-redis" }
openvclient-docker = { path = "crates/openvclient-docker" }
openvclient-net = { path = "crates/openvclient-net" }
openvclient-sqlserver = { path = "crates/openvclient-sqlserver" }
openvclient-mongo = { path = "crates/openvclient-mongo" }
openvclient-http = { path = "crates/openvclient-http" }
openvclient-storage = { path = "crates/openvclient-storage" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset", "query", "form"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies are optimised in debug builds so the dev app stays responsive
# (egui layout and text shaping are slow unoptimised). opt-level 1 keeps most
# of that speed-up and compiles a clean debug build about 23% faster than 2.
[profile.dev.package."*"]
opt-level = 1

# CI build and test: the dev profile (same debug assertions and overflow
# checks) without debug info and with unoptimised dependencies. A clean build
# takes less than half as long, and the cached target directory is much
# smaller. Tests don't need optimised dependencies; the debug app
# does (egui), so the dev profile keeps them. Use with `cargo build/test --profile ci`.
[profile.ci]
inherits = "dev"
debug = 0

[profile.ci.package."*"]
opt-level = 0

[workspace.lints.clippy]
# Long closure/channel types are clearer inline than as one-off aliases.
type_complexity = "allow"
